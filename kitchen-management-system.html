<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Management System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}header{background:#183153;color:#fff;padding:16px;text-align:center;font-size:21px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}input,button,select{width:100%;padding:12px;border-radius:9px;border:1px solid #ccd3db;font-size:15px;margin:6px 0}button{background:#183153;color:#fff;border:0;font-weight:700}.danger{background:#b42318}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile{padding:18px;background:#eef4ff;border-radius:12px;text-align:center;font-weight:700}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}nav button{font-size:13px;margin:0}.small{font-size:13px;color:#64748b}</style></head><body>
<header>🍲 Kitchen Management System</header><div class="wrap">
<section id="login" class="card"><h2>Admin Login</h2><p class="small">Firebase Authentication</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><nav><button onclick="show('dashboard')">🏠 Dashboard</button><button onclick="show('meal')">🍽️ Meal Plan</button><button onclick="show('staff')">👥 Staff</button><button onclick="show('stock')">📦 Stock</button><button onclick="show('reports')">📊 Reports</button><button class="danger" onclick="logout()">Logout</button></nav>
<div id="dashboard" class="card"><h2>Dashboard</h2><div class="grid"><div class="tile">🍽️ Meal Plan<br>Ready</div><div class="tile">👥 Staff<br>300 Capacity</div><div class="tile">📦 Stock<br>Cloud</div><div class="tile">📊 Reports<br>Ready</div></div></div>
<div id="meal" class="card hidden"><h2>Daily Meal Plan</h2><input id="mealDate" type="date"><input id="breakfast" type="number" min="0" placeholder="Breakfast people"><input id="lunch" type="number" min="0" placeholder="Lunch people"><input id="dinner" type="number" min="0" placeholder="Dinner people"><input id="menu" placeholder="Menu items"><button onclick="saveMeal()">Save Meal Plan</button><div id="mealMsg"></div></div>
<div id="staff" class="card hidden"><h2>Staff / Attendance</h2><p class="small">Maximum 300 staff</p><input id="staffName" placeholder="Staff name"><input id="staffId" placeholder="Staff ID"><input id="department" placeholder="Department"><select id="status"><option>Present</option><option>Absent</option><option>Leave</option></select><button onclick="saveStaff()">Save Attendance</button><div id="staffMsg"></div></div>
<div id="stock" class="card hidden"><h2>Stock</h2><input id="item" placeholder="Ingredient / item"><input id="qty" type="number" min="0" placeholder="Quantity"><input id="unit" placeholder="Unit (kg / g / litre / pcs)"><button onclick="saveStock()">Save Stock</button><div id="stockMsg"></div></div>
<div id="reports" class="card hidden"><h2>Reports</h2><p class="small">Basic CSV export. Full reports will be added in the next modules.</p><button onclick="exportCSV()">Export CSV</button></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBdn-TU1rsM32t00hwSLNSdpt45vVFpGfs",authDomain:"kitchen-management-project.firebaseapp.com",projectId:"kitchen-management-project",storageBucket:"kitchen-management-project.firebasestorage.app",messagingSenderId:"232836412028",appId:"1:232836412028:web:8e7cef2f0b95b942300ff9"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
window.login=async()=>{const m=document.getElementById("loginMsg");try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);const s=await getDoc(doc(db,"users",c.user.uid));if(!s.exists()||s.data().role!=="admin"||s.data().active!==true){await signOut(auth);m.textContent="Admin access is not configured."}}catch(e){m.textContent="Login failed: "+e.message}};
onAuthStateChanged(auth,u=>{login.classList.toggle("hidden",!!u);app.classList.toggle("hidden",!u)});window.logout=()=>signOut(auth);window.show=id=>["dashboard","meal","staff","stock","reports"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
window.saveMeal=async()=>{try{await addDoc(collection(db,"mealPlans"),{date:mealDate.value,breakfast:+breakfast.value||0,lunch:+lunch.value||0,dinner:+dinner.value||0,menu:menu.value.trim(),createdAt:serverTimestamp()});mealMsg.textContent="Meal plan saved."}catch(e){mealMsg.textContent=e.message}};
window.saveStaff=async()=>{try{await addDoc(collection(db,"attendance"),{name:staffName.value.trim(),staffId:staffId.value.trim(),department:department.value.trim(),status:status.value,createdAt:serverTimestamp()});staffMsg.textContent="Attendance saved."}catch(e){staffMsg.textContent=e.message}};
window.saveStock=async()=>{try{await addDoc(collection(db,"stock"),{item:item.value.trim(),quantity:+qty.value||0,unit:unit.value.trim(),createdAt:serverTimestamp()});stockMsg.textContent="Stock saved."}catch(e){stockMsg.textContent=e.message}};
window.exportCSV=()=>{const c="Module,Status\nMeal Plan,Firebase connected\nAttendance,Firebase connected\nStock,Firebase connected";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="kitchen-report.csv";a.click()};
</script></body></html>
